<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0b1f">
<meta name="description" content="Pasch – ein Würfel-Roguelike im Browser.">
<title>Pasch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0b1f; overscroll-behavior: none; }
  body { position: fixed; inset: 0; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #bg, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #app { position: fixed; inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #fx { z-index: 50; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app"></div>
<canvas id="fx"></canvas>
<noscript><p style="color:#f4ecd8;font:16px sans-serif;text-align:center;margin-top:40vh">Pasch braucht JavaScript.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
