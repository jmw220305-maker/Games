  .play-tray { margin: auto 0; }
  .hands { min-height: 40px; gap: 2px; }
  .hand-chip { min-height: 38px; padding: 1px 9px; font-size: 13px; border-width: 2px; }
  .hc-base { font-size: 11px; }
  .hands-row { gap: 5px; flex-wrap: nowrap; overflow-x: auto; max-width: 100%; padding: 2px 4px 4px; scrollbar-width: none; }
  .hands-row::-webkit-scrollbar { display: none; }
  .play-buttons { gap: 8px; flex-wrap: nowrap; }
  .play-buttons .btn { min-width: 150px; min-height: 44px; font-size: 17px; padding: 2px 14px; }
  .btn--l { font-size: 18px; min-height: 46px; padding: 4px 18px; }
  .btn--s { min-height: 38px; font-size: 13px; }
  /* Partie-Auswahl */
  .sub-blinds { justify-content: flex-start; overflow: hidden auto; gap: 4px; }
  .sub-blinds .sub-head { display: none; }
  .blinds-row { gap: 8px; width: 100%; }
  .blind { width: auto; flex: 1 1 0; min-width: 0; max-width: 230px; }
  .blind-in { gap: 4px; padding: 6px 8px; border-radius: 14px; }
  .blind-state { font-size: 9px; padding: 1px 8px; }
  .blind-name { font-size: 15px; }
  .blind-medal, .blind--warden .blind-medal { width: 38px; height: 38px; font-size: 20px; }
  .blind-warden { font-size: 14px; }
  .blind-desc { font-size: 11px; min-height: 0; line-height: 1.15; }
  .blind-target { padding: 1px 8px; border-radius: 9px; }
  .blind-cap { font-size: 9px; }
  .blind-num { font-size: 18px; }
  .blind-reward { font-size: 12px; }
  .blind-actions { gap: 4px; }
  .blind-actions .btn--l { min-height: 42px; font-size: 17px; }
  .blind-tag { font-size: 10px; padding: 2px 4px; gap: 4px; }
  .blind-tag-txt span { display: none; }
  .blind-tag .tag-chip { width: 22px; height: 22px; font-size: 12px; }
  /* Laden: Angebote links, Beutel + Privileg rechts, Knöpfe oben */
  .sub-shop { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; grid-template-areas: "top top" "offers lower"; justify-content: center; align-content: start; gap: 6px; padding-top: 0; }
  .shop-top { grid-area: top; width: 100%; justify-content: flex-end; }
  .shop-sign { display: none; }
  .shop-ctl { gap: 6px; }
  .shop-ctl .btn { min-height: 40px; font-size: 15px; padding: 2px 14px; }
  .shop-shelf--offers { grid-area: offers; width: auto; }
  .shop-lower { grid-area: lower; width: auto; gap: 6px; }
  .shop-shelf { padding: 16px 6px 6px; border-radius: 12px; border-width: 2px; }
  .shelf-cap { font-size: 9px; left: 8px; top: 2px; }
  .shop-row { --cw: 58px; gap: 6px; flex-wrap: nowrap; }
  .offer { gap: 4px; }
  .offer .btn { font-size: 12px; min-height: 36px; padding: 1px 4px; max-width: calc(var(--cw) + 10px); }
  .shop-row .card-top { display: none; }
  .shop-row .card-face { justify-content: center; gap: 3px; }
  .shop-row .card-name, .pack-row .card-name { -webkit-line-clamp: 3; min-height: 0; }
  /* Beutel */
  .sub-pack { gap: 4px; justify-content: flex-start; overflow: hidden auto; }
  .pack-head { gap: 8px; }
  .pack-glyph { width: 34px; height: 34px; font-size: 18px; }
  .pack-titles .sub-title { font-size: 18px; }
  .pack-titles .sub-subtitle { font-size: 11px; }
  .pack-picks { font-size: 11px; margin-top: 1px; }
  .pack-row { --cw: 66px; gap: 10px; min-height: 0; }
  .pack-item { gap: 4px; }
  .pack-acts { gap: 3px; width: calc(var(--cw) + 18px); }
  .pack-acts .btn { min-height: 34px; font-size: 12px; padding: 1px 4px; }
  .pack-bag { --cw: 80px; }
  .pack-foot .btn { min-height: 38px; }
  /* Abrechnung & Ende */
  .sub-result, .sub-gameover { justify-content: flex-start; overflow: hidden auto; padding: 2px 0; }
  .result-panel, .go-panel { padding: 8px 12px; gap: 5px; border-radius: 14px; }
  .result-title, .go-title { font-size: 22px; }
  .result-sub, .go-sub { font-size: 12px; }
  .result-line { padding: 3px 10px; font-size: 14px; }
  .result-glyph { width: 22px; height: 22px; }
  .result-amt { font-size: 16px; }
  .result-total { padding: 3px 10px; font-size: 15px; }
  .result-total b { font-size: 22px; }
  .result-actions .btn { min-width: 200px; }
  .go-panel { width: min(600px, 100%); }
  .go-best { padding: 3px 8px; display: flex; align-items: baseline; justify-content: center; gap: 10px; }
  .go-best-num { font-size: 24px; }
  .go-seed { display: none; }
  .go-buttons .btn--l { min-height: 42px; }
  .go-stats { grid-template-columns: repeat(4, 1fr); gap: 3px; }
  .go-stat { flex-direction: column; align-items: center; gap: 0; padding: 2px 4px; font-size: 10px; text-align: center; }
  .go-stat b { font-size: 14px; }
  .go-buttons { flex-direction: row; }
  .go-buttons .btn { flex: 1; }
  /* Dialoge */
  .modal-wrap { padding: 6px; }
  .modal-panel { padding: 8px 12px; border-radius: 14px; }
  .modal-title { font-size: 20px; }
  .modal-sub { font-size: 12px; }
  .modal-body { margin-top: 6px; }
  .modal-buttons { margin-top: 8px; }
  .insp-list { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .newrun { gap: 4px; }
  .cups { grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .cup { min-height: 54px; padding: 4px 2px; }
  .cup-glyph { font-size: 20px; }
  .cup-name { font-size: 9px; }
  .cup-req { display: none; }
  .cup-info, .stake-info { min-height: 0; font-size: 12px; }
  .stake { min-height: 40px; font-size: 18px; }
  .toasts { top: 6px; right: 6px; width: min(300px, 44vw); }
  .toast { padding: 3px 8px; font-size: 12px; }
}
/* Knopfleiste in Dialogen bleibt sichtbar, auch wenn der Inhalt scrollt */
.modal-buttons { position: sticky; bottom: 0; z-index: 2; padding: 8px 0 4px; background: linear-gradient(180deg, rgba(23, 15, 46, 0), #170f2e 30%); }

</style>
</head>
